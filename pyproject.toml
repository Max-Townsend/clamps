[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clamp-chapter4"
version = "1.0.0"
description = "Reproducible thesis Chapter 4 clamp analyses"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "matplotlib>=3.9", "statsmodels>=0.14", "joblib>=1.4"]

[project.scripts]
clamp-chapter4 = "clamp_analysis.__main__:main"

[tool.setuptools.packages.find]
include = ["clamp_analysis*"]
